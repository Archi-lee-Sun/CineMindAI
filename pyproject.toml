[project]
name = "cinemindai-backend"
version = "0.1.0"
description = "CineMind AI FastAPI backend with PostgreSQL persistence and session authentication."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.4.0",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "aiosmtpd==1.4.6",
    "httpx2==2.16.2",
    "pytest==9.2.0",
    "uv==0.13.9",
]

[tool.uv]
package = false
required-version = "==0.13.9"
python-downloads = "never"
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
