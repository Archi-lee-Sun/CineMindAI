[project]
name = "cinemindai-backend"
version = "0.1.0"
description = "Initial FastAPI backend for the CineMind AI learning project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
    "uv==0.13.9",
]

[tool.uv]
package = false
required-version = "==0.13.9"
python-downloads = "never"
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
